<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calvin — Business Card</title>
<style>
  :root{
    --bg:#FDF5F5;
    --fg:#2D2A26;
    --muted:#6B6058;
    --accent:#800020;
    --accentSoft:#F5E0E0;
    --accentWarm:#FAF0F0;
    --card:#FFFFFF;
    --border:#E8D5D5;
    --serif:Georgia,'Times New Roman',serif;
    --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  }

  *{margin:0;padding:0;box-sizing:border-box}

  /* ===== PAGE LAYOUT (print-friendly) ===== */
  body{
    font-family:var(--sans);
    background:#e0e0e0;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    gap:24px;
    padding:40px 20px;
    min-height:100vh;
    flex-wrap:wrap;
  }

  /* ===== CARD BASE ===== */
  .card{
    width:3.5in;
    height:2in;
    border-radius:8px;
    overflow:hidden;
    position:relative;
    box-shadow:0 4px 20px rgba(0,0,0,.15);
    flex-shrink:0;
  }

  /* ===== FRONT SIDE ===== */
  .card-front{
    background:var(--bg);
    display:flex;
    flex-direction:column;
  }

  .front-content{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:0.25in 0.3in;
    text-align:center;
  }

  .front-name{
    font-family:var(--serif);
    font-size:26pt;
    font-weight:700;
    color:var(--fg);
    letter-spacing:-.02em;
    margin-bottom:4px;
    line-height:1.1;
  }

  .front-role{
    font-family:var(--sans);
    font-size:9pt;
    color:var(--accent);
    font-weight:600;
    letter-spacing:.08em;
    text-transform:uppercase;
    margin-bottom:8px;
  }

  .front-tagline{
    font-family:var(--sans);
    font-size:7.5pt;
    color:var(--muted);
    font-style:italic;
    line-height:1.5;
    max-width:2.5in;
  }

  /* Burgundy band at bottom */
  .front-band{
    background:var(--accent);
    padding:0.12in 0.3in;
    display:flex;
    justify-content:center;
    align-items:center;
    gap:6px;
  }

  .front-band-wa{
    font-family:var(--sans);
    font-size:8pt;
    color:#FFFFFF;
    font-weight:600;
    letter-spacing:.03em;
    display:flex;
    align-items:center;
    gap:6px;
  }

  .front-band-wa svg{
    width:12px;
    height:12px;
    fill:#fff;
    flex-shrink:0;
  }

  /* Thin accent line above band */
  .front-accent-line{
    height:2px;
    background:var(--accentSoft);
  }

  /* ===== BACK SIDE ===== */
  .card-back{
    background:var(--card);
    display:grid;
    grid-template-columns: 1fr auto;
    gap:0.15in;
    padding:0.25in 0.3in;
    align-items:center;
  }

  .back-left{
    display:flex;
    flex-direction:column;
    gap:5px;
  }

  .back-agency{
    font-family:var(--serif);
    font-size:10pt;
    font-weight:700;
    color:var(--accent);
    margin-bottom:1px;
  }

  .back-agency-sub{
    font-family:var(--sans);
    font-size:6pt;
    color:var(--muted);
    letter-spacing:.08em;
    text-transform:uppercase;
    margin-bottom:6px;
  }

  .back-separator{
    height:1px;
    background:var(--border);
    margin-bottom:6px;
  }

  .back-contact{
    display:flex;
    flex-direction:column;
    gap:4px;
  }

  .back-contact-item{
    display:flex;
    align-items:center;
    gap:6px;
  }

  .back-contact-icon{
    font-size:8pt;
    width:14px;
    text-align:center;
    flex-shrink:0;
  }

  .back-contact-label{
    font-family:var(--sans);
    font-size:5.5pt;
    color:var(--muted);
    text-transform:uppercase;
    letter-spacing:.06em;
    min-width:42px;
  }

  .back-contact-value{
    font-family:var(--sans);
    font-size:7.5pt;
    color:var(--fg);
    font-weight:500;
  }

  .back-right{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
  }

  .back-qr{
    width:70px;
    height:70px;
    border-radius:4px;
  }

  .back-qr-text{
    font-family:var(--sans);
    font-size:7pt;
    color:var(--accent);
    font-weight:600;
    letter-spacing:.03em;
  }

  /* ===== PRINT STYLES ===== */
  @media print{
    body{
      background:#fff;
      padding:0;
      gap:0;
      display:block;
    }
    .card{
      box-shadow:none;
      border-radius:0;
      margin:0;
      page-break-after:always;
    }
    .card:last-child{
      page-break-after:auto;
    }
  }
</style>
</head>
<body>

  <!-- ===== FRONT SIDE ===== -->
  <div class="card card-front">

      <div class="front-name">Calvin</div>
      <div class="front-role">Life Planner · AIA · Medan</div>
      <div class="front-tagline">"Langkah pertama menuju masa depan yang aman adalah berani bertanya dan merencanakan."</div>
    </div>
    <div class="front-accent-line"></div>
    <div class="front-band">
      <span class="front-band-wa">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
        +62 821-8331-654
      </span>
    </div>
  </div>

  <!-- ===== BACK SIDE ===== -->
  <div class="card card-back">
    <div class="back-left">
      <div class="back-agency">SGA MDN STARLIGHT</div>
      <div class="back-agency-sub">Agency Resmi AIA Medan</div>
      <div class="back-separator"></div>

      <div class="back-contact">
        <div class="back-contact-item">
          <span class="back-contact-icon">💬</span>
          <span class="back-contact-label">WhatsApp</span>
          <span class="back-contact-value">+62 821-8331-654</span>
        </div>
        <div class="back-contact-item">
          <span class="back-contact-icon">📍</span>
          <span class="back-contact-label">Lokasi</span>
          <span class="back-contact-value">AIA Center Medan — Lippo Plaza Lt. 9</span>
        </div>
        <div class="back-contact-item">
          <span class="back-contact-icon">📋</span>
          <span class="back-contact-label">Agent Code</span>
          <span class="back-contact-value">08878752</span>
        </div>
      </div>
    </div>

    <div class="back-right">
      <img class="back-qr" src="https://api.qrserver.com/v1/create-qr-code/?size=140x140&color=000000&bgcolor=FFFFFF&data=https://tanyacalvin.com" alt="QR tanyacalvin.com">
      <span class="back-qr-text">tanyacalvin.com</span>
    </div>
  </div>

</body>
</html>
